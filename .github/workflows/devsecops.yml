name: DevSecOps Pipeline

on:
  push:
    branches: [ main, fix/gh-actions-investigation ]
  pull_request:
    branches: [ main, fix/gh-actions-investigation ]

jobs:
  # 1. Build & Test (Unit Tests + Static Analysis)
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Deps
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

      - name: Install Frontend Deps
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  # 2. SCA - Software Composition Analysis (Security)
  security-sca:
    name: 🛡️ SCA (Dependencies)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Audit Backend
        working-directory: ./backend
        run: npm audit --audit-level=critical --omit=dev
      - name: Audit Frontend
        working-directory: ./frontend
        run: npm audit --audit-level=critical --omit=dev

  # 3. Deploy to Staging (Mock)
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: security-sca
    steps:
      - name: Simulating Deployment
        run: echo "Deploying to Staging Env..."

  # 4. DAST - Dynamic Application Security Testing (OWASP ZAP)
  security-dast:
    name: 🕵️ DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install & Start Backend
        working-directory: ./backend
        run: |
          npm ci
          npx tsx src/presentation/server.ts &
          echo "Waiting for Backend..."
          sleep 10
        env:
          PORT: 3000
          OPENAI_API_KEY: "mock-key-for-ci"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:3000/'
          cmd_options: '-a'
          allow_issue_writing: false
        continue-on-error: true

  # 5. Deploy to Production
  deploy-production:
    name: 🚢 Deploy Production
    runs-on: ubuntu-latest
    needs: security-dast
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploying Artifacts
        run: echo "Deploying to Production..."
